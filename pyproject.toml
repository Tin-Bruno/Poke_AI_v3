[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poke-ai-v3"
version = "0.1.0"
description = "Starter kit de reinforcement learning para treinar uma IA em Pokemon Red/Blue via PyBoy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pyboy>=2.6",
    "stable-baselines3>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
