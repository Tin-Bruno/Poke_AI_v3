[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poke-ai-v3"
version = "0.1.0"
description = "Starter kit de reinforcement learning para treinar uma IA em Pokemon Red/Blue via PyBoy."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyboy>=2.6",
    "stable-baselines3>=2.4",
    "tensorboard>=2.18",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["project_config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "memory*", "phases*", "rewards*"]
exclude = ["tests*", "scripts*", "roms*", "states*", "models*", "runs*", "logs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
